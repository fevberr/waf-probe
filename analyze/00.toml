[project]
name = "wafprobe-analyze"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.6",
    "matplotlib>=3.8",
]

[project.scripts]
waf-analyze = "wafprobe_analyze.00:0"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"