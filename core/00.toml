[package]
name = "waf-probe-core"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "waf-probe"
path = "02/00.rs"

[lib]
name = "waf_probe_core"
path = "02/01.rs"

[dependencies]
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "cookies"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
anyhow = "1.0"
thiserror = "1.0"
url = "2.5"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
owo-colors = "4.0"
comfy-table = "7.1"
futures = "0.3"
percent-encoding = "2"

[profile.release]
opt-level = "z"
lto = true
strip = true